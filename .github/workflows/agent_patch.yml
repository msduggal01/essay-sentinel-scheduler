# Add or replace a marked section in the live Essay agent's prompt. Backs up first (artifact),
# dry run unless apply is ticked, and uses the agent version as an optimistic lock.
name: Essay Agent Patch
on:
  workflow_dispatch:
    inputs:
      patch:
        description: "Patch file"
        default: "ops/agent_patches/brief_voice.md"
        type: string
      name:
        description: "Section marker name"
        default: "BRIEF_VOICE"
        type: string
      apply:
        description: "Apply to the live agent (otherwise a dry run)"
        default: false
        type: boolean
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ESSAY_AGENT_ID: ${{ secrets.ESSAY_AGENT_ID }}
        run: python3 ops/agent_patch.py "${{ inputs.patch }}" --name "${{ inputs.name }}" ${{ inputs.apply && '--apply' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-backup
          path: agent_backup.json
          retention-days: 90
