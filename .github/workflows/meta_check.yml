name: Meta check (weekly, posts nothing)

# Every Sunday, a day before the week's first Reel: is the Page token still good, and is the
# Instagram account still the one linked to the Page? meta_publish.py --check posts nothing
# and exits 1 on any problem, so this run goes red (and GitHub emails the owner) before a
# Reel is lost to an expired token, instead of the daily run staying green without it.
on:
  schedule:
    - cron: "30 1 * * 0"   # 01:30 UTC Sunday = 07:00 IST
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Token and accounts
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: python3 meta_publish.py --check
