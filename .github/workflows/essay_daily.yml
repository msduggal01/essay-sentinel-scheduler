# Essay Sentinel - DAILY run with weekday-driven mode
# Place at  .github/workflows/essay_daily.yml  in the Essay pipeline repo
# (alongside 04_Code/*.py + requirements.txt).
#
# One daily cron. Mon/Wed/Fri -> mode=brief (paid PDF + email + archive + video).
# All other days -> mode=video (free daily masterclass only). One video every day,
# a PDF three times a week. No double-runs.
#
# Repo secrets: ANTHROPIC_API_KEY, ESSAY_AGENT_ID, ESSAY_ENV_ID, ELEVENLABS_API_KEY,
#   ESSAY_VOICE_ID, YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN,
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHANNEL (=@upscdesk_essay), ESSAY_SUBSCRIBE_URL
name: Essay Sentinel Daily
on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC = 07:30 IST, every day
  workflow_dispatch:
    inputs:
      mode:
        description: "force mode (brief|video); blank = auto by weekday"
        required: false
        default: ""
permissions:
  contents: write        # the heartbeat commit that keeps the schedule alive
# One run at a time: a manual dispatch while the morning run is still going waits for it
# instead of running alongside it and publishing the same day twice at the same moment.
concurrency:
  group: essay-daily
  cancel-in-progress: false
env:
  UPSC_DESK: essay       # meta_publish.py words its fallback caption for the desk
jobs:
  run_essay_sentinel:
    runs-on: ubuntu-latest
    # A brief day's session has taken twenty minutes, the render five; the poll below waits
    # at most fifty, and the extractor's corrections up to twenty more.
    timeout-minutes: 90
    outputs:
      has_script: ${{ steps.kept.outputs.has_script }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4     # the YouTube thumbnail is a Remotion still
        with:
          node-version: "22"
      - name: Install ffmpeg, fonts and Python libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
          pip install -r requirements.txt

      - name: Decide mode (Mon/Wed/Fri = brief, else video)
        id: mode
        run: |
          FORCED="${{ github.event.inputs.mode }}"
          if [ -n "$FORCED" ]; then
            MODE="$FORCED"
          else
            DOW=$(date -u +%u)   # 1=Mon .. 7=Sun
            if [ "$DOW" = "1" ] || [ "$DOW" = "3" ] || [ "$DOW" = "5" ]; then MODE="brief"; else MODE="video"; fi
          fi
          echo "MODE=$MODE" >> $GITHUB_OUTPUT
          echo "Today's mode: $MODE"

      - name: Create agent session
        id: create_session
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ESSAY_AGENT_ID: ${{ secrets.ESSAY_AGENT_ID }}
          ESSAY_ENV_ID: ${{ secrets.ESSAY_ENV_ID }}
        run: |
          # The brief v2 kit, mounted read-only at /mnt/session/uploads/brief/ (the sandbox network cannot
          # reach GitHub). If the kit cannot be attached the list is empty, the session starts as
          # before, and the agent builds that day's brief in the old design and says so in its log.
          python3 brief/mount_kit.py resources > kit_resources.json || echo "[]" > kit_resources.json
          BODY=$(python3 -c "import json, os; print(json.dumps({'agent': os.environ['ESSAY_AGENT_ID'], 'environment_id': os.environ['ESSAY_ENV_ID'], 'resources': json.load(open('kit_resources.json'))}))")
          RESPONSE=$(curl -s -X POST https://api.anthropic.com/v1/sessions -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" -H "anthropic-version: 2023-06-01" -H "anthropic-beta: managed-agents-2026-04-01" -H "Content-Type: application/json" -d "$BODY")
          if ! echo "$RESPONSE" | python3 -c "import sys,json; json.load(sys.stdin)['id']" 2>/dev/null; then
            echo "::warning::the session was refused with the kit attached; starting it without the kit"
            RESPONSE=$(curl -s -X POST https://api.anthropic.com/v1/sessions -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" -H "anthropic-version: 2023-06-01" -H "anthropic-beta: managed-agents-2026-04-01" -H "Content-Type: application/json" -d "{\"agent\":\"${{ secrets.ESSAY_AGENT_ID }}\",\"environment_id\":\"${{ secrets.ESSAY_ENV_ID }}\"}")
          fi
          python3 brief/mount_kit.py cleanup 2>/dev/null || true
          SESSION_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "SESSION_ID=$SESSION_ID" >> $GITHUB_OUTPUT
          echo "Session: $SESSION_ID"

      - name: Send trigger (with mode)
        run: |
          SID="${{ steps.create_session.outputs.SESSION_ID }}"
          MODE="${{ steps.mode.outputs.MODE }}"
          curl -s -X POST "https://api.anthropic.com/v1/sessions/$SID/events" -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" -H "anthropic-version: 2023-06-01" -H "anthropic-beta: managed-agents-2026-04-01" -H "Content-Type: application/json" -d "{\"events\":[{\"type\":\"user.message\",\"content\":[{\"type\":\"text\",\"text\":\"execute mode=$MODE\"}]}]}"

      - name: Poll until completion
        # Until 27 September the loop simply ran out of tries and the run went on to extract
        # from a session that was still working, which is how a resend could land in the
        # middle of the day's steps. Now it waits up to fifty minutes and then stops the day
        # with an error that says so.
        run: |
          SID="${{ steps.create_session.outputs.SESSION_ID }}"
          LAST=0; STABLE=0; STARTED=false; DONE=false
          DEADLINE=$(( $(date +%s) + 50*60 ))
          sleep 20
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            EVTS=$(curl -s "https://api.anthropic.com/v1/sessions/$SID/events" -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" -H "anthropic-version: 2023-06-01" -H "anthropic-beta: managed-agents-2026-04-01")
            SESS=$(curl -s "https://api.anthropic.com/v1/sessions/$SID" -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" -H "anthropic-version: 2023-06-01" -H "anthropic-beta: managed-agents-2026-04-01")
            COUNT=$(echo "$EVTS" | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('data',d.get('events',[]))))" 2>/dev/null || echo "0")
            STATUS=$(echo "$SESS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "unknown")
            echo "Status: $STATUS | Events: $COUNT"
            if [ "$COUNT" -gt 0 ] && [ "$STARTED" = "false" ]; then STARTED=true; STABLE=0; fi
            if [ "$STARTED" = "true" ] && [ "$STATUS" = "idle" ]; then
              if [ "$COUNT" -eq "$LAST" ]; then STABLE=$((STABLE+1)); [ $STABLE -ge 3 ] && { echo "Done. Events: $COUNT"; DONE=true; break; }; else STABLE=0; fi
            fi
            LAST=$COUNT
            { [ "$STATUS" = "error" ] || [ "$STATUS" = "failed" ]; } && { echo "Failed: $STATUS"; exit 1; }
            sleep 30
          done
          if [ "$DONE" != "true" ]; then
            echo "::error::The agent session $SID was still working after fifty minutes; nothing was extracted. Check the session before any rerun: it may already have emailed the brief."
            exit 1
          fi

      - name: Extract video script JSON
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # One-shot extraction made any malformed reply fatal for the whole day, which is
        # what happened on 3, 5 and 6 September. The extractor now hands the reason back to
        # the same session and lets the agent correct itself, up to twice, as the GS desk
        # has done since 21 September.
        run: python3 ops/extract.py "${{ steps.create_session.outputs.SESSION_ID }}" video_script.json

      - name: Humanise the narration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # The agent writes correct essays in a recognisably generated voice. This rewrites
        # only the spoken narration, under guardrails checked in code: every timing cue must
        # still be spoken, every number preserved, no dashes, length held. A slide that fails
        # any check keeps its original narration, so this can improve the voice and cannot
        # cost the day's video.
        run: python3 humanize.py video_script.json --diff || echo "humanising skipped; the original narration stands"

      - name: Keep the day's script (the Reel job and any rerun read it)
        uses: actions/upload-artifact@v4
        with:
          name: script
          path: video_script.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Tell the Reel job there is a script
        id: kept
        run: |
          if [ -f video_script.json ]; then echo "has_script=true" >> "$GITHUB_OUTPUT"; fi

      - name: Heartbeat, so the schedule is never disabled again
        # GitHub disables a repository's scheduled workflows after 60 days with no commits.
        # The last commit here was 7 July, so both workflows were switched off on 6
        # September and the Essay desk went silent without anything failing. A commit on
        # every run keeps the clock from ever reaching sixty. A push can be refused when
        # something landed on main during the run, and that used to stop the whole day
        # before the render; now it catches up and tries again, and if it still cannot, the
        # day goes on with a warning (the next run's heartbeat will do).
        run: |
          date -u +%FT%TZ > .last_run
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_run
          git diff --cached --quiet && exit 0
          git commit -q -m "Ran $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && { echo "heartbeat pushed"; exit 0; }
            git rebase --abort 2>/dev/null || true
            sleep $((10 * i))
          done
          echo "::warning::The heartbeat commit could not be pushed; the day goes on without it"

      - name: Render video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ESSAY_VOICE_ID: ${{ secrets.ESSAY_VOICE_ID }}
        run: python3 render_video.py video_script.json

      - name: YouTube thumbnail in the design system (remotion/src/DeskThumb.tsx)
        # render_video.py has drawn its PIL thumbnail at build/issue_N/thumb.png; this replaces it
        # with a Remotion still (header H2, one of T1 to T6 by issue, a six-word hook from one
        # Claude call; rules in docs/THUMBNAILS.md). Best effort: if anything fails, a warning
        # says so and the PIL thumbnail is uploaded as before.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if ! { bash ops/chrome_deps.sh && (cd remotion && npm ci --no-audit --no-fund --silent); }; then
            echo "::warning::Remotion could not be set up; the YouTube thumbnail is render_video.py's PIL one today"
            exit 0
          fi
          python3 ops/desk_thumb.py video_script.json

      - name: Upload to YouTube and post to Telegram
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          ESSAY_SUBSCRIBE_URL: ${{ secrets.ESSAY_SUBSCRIBE_URL }}
        # The upload's output used to go straight into grep, so a failed upload left an empty
        # URL, the step carried on, and Telegram was handed nothing. Now the output is kept
        # in the log, a failure in the pipe fails the step, and no URL means no post.
        run: |
          set -o pipefail
          ISSUE=$(python3 -c "import json;print(json.load(open('video_script.json'))['issue_no'])")
          # the one upload of the day that notifies subscribers; its English captions follow it
          python3 upload_youtube.py --video build/issue_$ISSUE/video_issue_$ISSUE.mp4 --meta build/issue_$ISSUE/youtube_meta.txt --thumbnail build/issue_$ISSUE/thumb.png --privacy public \
            --captions build/issue_$ISSUE/captions.srt 2>&1 | tee upload_youtube.log
          URL=$(grep -o 'https://youtu.be/[^ ]*' upload_youtube.log | head -1 || true)
          if [ -z "$URL" ]; then echo "::error::The YouTube upload gave no URL; nothing was posted to Telegram"; exit 1; fi
          echo "YouTube: $URL"
          python3 post_telegram.py --json video_script.json --youtube "$URL" --thumb build/issue_$ISSUE/thumb.png

      - name: Confirm the brief email went out
        # The agent emails the brief itself, inside its session, and nothing checked that it
        # did. Last, so it blocks nothing; on a brief day without a confirmed send it fails
        # the run with "Brief email not confirmed", which is what the owner sees.
        if: ${{ always() && steps.mode.outputs.MODE == 'brief' && steps.create_session.outputs.SESSION_ID != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 ops/brief_check.py "${{ steps.create_session.outputs.SESSION_ID }}"

  # ---- The day's Reel: the new format (remotion/src/DeskShort.tsx), one a day ----
  # Its own job after the day's run, with its own time budget; best effort throughout. The
  # Reel goes to YouTube as a Short and to Instagram and Facebook as a Reel (--crosspost).
  # If it cannot be made or uploaded, the old Essay Short goes out in its place.
  # It runs whenever the day's script exists, not only when the whole main job succeeded: a
  # failed YouTube upload, a Telegram error or an unconfirmed brief email is no reason to
  # lose the Reel too.
  reel:
    needs: run_essay_sentinel
    if: ${{ !cancelled() && needs.run_essay_sentinel.outputs.has_script == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System packages (ffmpeg, fonts, headless Chrome libraries)
        run: bash ops/chrome_deps.sh && pip install -q -r requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: script
      - name: The day's Reel
        id: reel
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ secrets.ESSAY_VOICE_ID || 'gad8DmXGyu7hwftX9JqI' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: |
          test -f video_script.json || { echo "no essay script today"; exit 1; }
          (cd remotion && npm ci --no-audit --no-fund --silent)
          python3 ops/reel_props.py essay video_script.json reel_props.json
          # --cover: the Reel's cover, a still of the Reel where its hook is whole on screen, and
          # that moment in ms beside it; the YouTube thumbnail and the Instagram and Facebook cover
          python3 ops/reel_cut.py reel_props.json reel.mp4 reel_meta.txt --cover reel_cover.png
          # no notification (the long video has the day's), English captions from reel.srt, the id
          # in reel_uploaded.txt the moment YouTube takes it (the old Short below then stands
          # down), and nothing at all if the playlist already had a Reel or Short today (a rerun)
          OUT=$(python3 upload_short.py --video reel.mp4 --meta reel_meta.txt --playlist "Essay Desk - Shorts" --privacy public --crosspost \
            --cover reel_cover.png --thumb-offset "$(cat reel_cover_ms.txt 2>/dev/null)" \
            --captions reel.srt --done-file reel_uploaded.txt --once-per-day open)
          echo "$OUT"
          if echo "$OUT" | grep -q "^ALREADY TODAY:"; then echo "a Reel or Short already went up today; nothing more"; exit 0; fi
          echo "$OUT" | grep -q "URL:" || { echo "the Reel was not confirmed on YouTube"; exit 1; }
      - name: Say so when the Reel did not go out
        # continue-on-error keeps the job green, which hid every failed Reel; this puts it on
        # the run's page as a warning
        if: ${{ steps.reel.outcome == 'failure' }}
        run: |
          if [ -f reel_uploaded.txt ]; then
            echo "::warning::The day's Reel step failed after the Reel reached YouTube ($(cat reel_uploaded.txt)); no old Short today"
            echo "- The day's Reel step failed after the Reel reached YouTube; no old Short today." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::The day's Reel failed (see 'The day's Reel'); the old Short goes out in its place"
          echo "- The day's Reel failed; the old Short was tried in its place." >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the Reel and its words
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: |
            reel.mp4
            reel_props.json
            reel_meta.txt
            reel_cover.png
            reel.srt
            reel_alignment.json
            remotion/public/reel_props.json
          if-no-files-found: ignore
          retention-days: 14
      - name: The old Short, only when the new Reel did not go out
        id: oldshort
        if: ${{ steps.reel.outcome != 'success' && hashFiles('reel_uploaded.txt') == '' }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ESSAY_VOICE_ID: ${{ secrets.ESSAY_VOICE_ID }}
          ESSAY_SUBSCRIBE_URL: ${{ secrets.ESSAY_SUBSCRIBE_URL }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: |
          # one Short at most, and none if the Reel went up after all (reel_uploaded.txt) or a Short
          # is already on the playlist today (upload_short.py --once-per-day closed)
          if [ -f video_script.json ]; then python3 build_daily_shorts.py video_script.json --desk essay --limit 1 --skip-if reel_uploaded.txt; fi
      - name: Say so when the old Short failed too
        if: ${{ steps.oldshort.outcome == 'failure' }}
        run: |
          echo "::warning::The old Short failed as well; no Short or Reel went out today"
          echo "- The old Short failed as well: no Short or Reel today." >> "$GITHUB_STEP_SUMMARY"
