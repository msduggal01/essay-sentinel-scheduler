name: Reel test (new format)

# Manual. Makes the day's Essay Reel exactly as the daily run does and keeps it as an
# artifact; with publish ticked it also uploads it. The script comes from a run's "script"
# artifact, or (for a day before that artifact existed) from an agent session id.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Daily run whose script to use (blank: the newest script artifact)"
        default: ""
      session_id:
        description: "Or: an agent session id to pull the script from (sesn_...)"
        default: ""
      props_run_id:
        description: "Or: a reel-test run whose Reel lines to reuse (no new lines are written, only the voice and the render)"
        default: ""
      publish:
        description: "Also upload it (YouTube, Instagram, Facebook)"
        type: boolean
        default: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System packages
        run: bash ops/chrome_deps.sh && pip install -q -r requirements.txt
      - name: The day's script
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_ID: ${{ inputs.run_id }}
          SESSION_ID: ${{ inputs.session_id }}
          PROPS_RUN_ID: ${{ inputs.props_run_id }}
        run: |
          if [ -n "$PROPS_RUN_ID" ]; then
            gh run download "$PROPS_RUN_ID" -n reel-test -D prev -R "${{ github.repository }}"
            cp prev/reel_props.json reel_props.json
            echo "reusing the Reel lines of run $PROPS_RUN_ID"; exit 0
          fi
          if [ -n "$SESSION_ID" ]; then
            python3 ops/extract.py "$SESSION_ID" video_script.json
          else
            if [ -z "$RUN_ID" ]; then
              RUN_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=script&per_page=20" --jq '[.artifacts[] | select(.expired==false)][0].workflow_run.id')
            fi
            gh run download "$RUN_ID" -n script -R "${{ github.repository }}"
          fi
          python3 -c "import json;d=json.load(open('video_script.json'));print('issue',d.get('issue_no'))"
      - name: Make the Reel
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ secrets.ESSAY_VOICE_ID || 'gad8DmXGyu7hwftX9JqI' }}
        run: |
          (cd remotion && npm ci --no-audit --no-fund --silent)
          [ -f reel_props.json ] || python3 ops/reel_props.py essay video_script.json reel_props.json
          python3 ops/reel_cut.py reel_props.json reel.mp4 reel_meta.txt
          cat reel_meta.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reel-test
          path: |
            reel.mp4
            reel_props.json
            reel_meta.txt
            remotion/public/reel_props.json
          retention-days: 14
      - name: Upload it
        if: ${{ inputs.publish }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: python3 upload_short.py --video reel.mp4 --meta reel_meta.txt --playlist "Essay Desk - Shorts" --privacy public --crosspost
